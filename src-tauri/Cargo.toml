[package]
name = "signalhive-charts"
version = "0.1.0"
description = "Offline technical charting and isolated virtual paper trading"
authors = ["Signalhive Charts contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "signalhive_charts_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
